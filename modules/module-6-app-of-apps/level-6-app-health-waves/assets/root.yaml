apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: beacon-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: http://gitea.gitea.svc.cluster.local:3000/platform/beacon-fleet.git
    targetRevision: main
    path: apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
