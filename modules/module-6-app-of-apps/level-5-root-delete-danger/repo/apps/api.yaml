apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: stock-api
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: http://gitea.gitea.svc.cluster.local:3000/platform/inventory-gitops.git
    targetRevision: main
    path: workloads/api
  destination:
    server: https://kubernetes.default.svc
    namespace: inventory-stock
  syncPolicy:
    automated: {}
    syncOptions:
    - CreateNamespace=true
