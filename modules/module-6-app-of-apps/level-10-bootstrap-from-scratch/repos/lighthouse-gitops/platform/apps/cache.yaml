apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lighthouse-cache
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: infra
  source:
    repoURL: http://gitea.gitea.svc.cluster.local:3000/platform/lighthouse-gitops.git
    targetRevision: main
    path: workloads/lighthouse-cache
  destination:
    server: https://kubernetes.default.svc
    namespace: lighthouse-infra
  syncPolicy:
    automated: {}
    syncOptions:
    - CreateNamespace=true
