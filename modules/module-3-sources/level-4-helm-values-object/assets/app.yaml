apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: search-suggest
  namespace: argocd
spec:
  project: default
  source:
    repoURL: http://gitea.gitea.svc.cluster.local:3000/platform/search-suggest.git
    targetRevision: main
    path: chart
    helm:
      valuesObject:
        search-suggest:
          replicaCount: 3
          banner: "search-suggest prod 4.1"
  destination:
    server: https://kubernetes.default.svc
    namespace: search
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
