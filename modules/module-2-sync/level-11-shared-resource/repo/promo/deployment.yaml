apiVersion: apps/v1
kind: Deployment
metadata:
  name: promo-banner
  labels: {app: promo-banner}
spec:
  replicas: 1
  selector:
    matchLabels: {app: promo-banner}
  template:
    metadata:
      labels: {app: promo-banner}
    spec:
      terminationGracePeriodSeconds: 2
      containers:
      - name: web
        image: hashicorp/http-echo:1.0
        imagePullPolicy: IfNotPresent
        args: ["-text=promo-banner v2.3", "-listen=:5678"]
        ports:
        - containerPort: 5678
        envFrom:
        - configMapRef: {name: feature-flags}
        resources:
          requests: {cpu: 10m, memory: 16Mi}
