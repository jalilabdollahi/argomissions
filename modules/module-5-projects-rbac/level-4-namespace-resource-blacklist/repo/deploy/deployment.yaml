apiVersion: apps/v1
kind: Deployment
metadata:
  name: mail-relay
  labels: {app: mail-relay}
spec:
  replicas: 1
  selector:
    matchLabels: {app: mail-relay}
  template:
    metadata:
      labels: {app: mail-relay}
    spec:
      terminationGracePeriodSeconds: 2
      containers:
      - name: web
        image: hashicorp/http-echo:1.0
        imagePullPolicy: IfNotPresent
        args: ["-text=mail-relay v3.2", "-listen=:5678"]
        env:
        - name: RELAY_TOKEN
          valueFrom:
            secretKeyRef:
              name: relay-credentials
              key: token
        ports:
        - containerPort: 5678
        resources:
          requests: {cpu: 10m, memory: 16Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: mail-relay
spec:
  selector: {app: mail-relay}
  ports:
  - port: 80
    targetPort: 5678
