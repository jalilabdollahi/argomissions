apiVersion: argomissions.io/v1
kind: StatusBoard
metadata:
  name: oncall
spec:
  title: On-call overview
  panels:
    - name: checkout-latency
      query: histogram_quantile(0.99, rate(checkout_seconds_bucket[5m]))
      refresh: 10s
    - name: error-budget
      query: slo:error_budget_remaining
      refresh:
    - name: queue-depth
      query: sum(queue_messages_ready)
      refresh: 1m
