apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ops-statusboard
  namespace: argocd
spec:
  project: default
  source:
    repoURL: http://gitea.gitea.svc.cluster.local:3000/platform/statusboard-config.git
    targetRevision: main
    path: deploy
  destination:
    server: https://kubernetes.default.svc
    namespace: boards
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
