apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sw-alerts
  namespace: argocd
spec:
  project: default
  source:
    repoURL: http://gitea.gitea.svc.cluster.local:3000/platform/stormwatch.git
    targetRevision: main
    path: workloads/alerts
  destination:
    server: https://kubernetes.default.svc
    namespace: stormwatch
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
