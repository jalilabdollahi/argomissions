apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rota-crds
  namespace: argocd
spec:
  project: default
  source:
    repoURL: http://gitea.gitea.svc.cluster.local:3000/platform/shiftboard.git
    targetRevision: main
    path: crds
  destination:
    server: https://kubernetes.default.svc
    namespace: shiftboard
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shiftboard
  namespace: argocd
spec:
  project: default
  source:
    repoURL: http://gitea.gitea.svc.cluster.local:3000/platform/shiftboard.git
    targetRevision: main
    path: deploy
  destination:
    server: https://kubernetes.default.svc
    namespace: shiftboard
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
