apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: meridian-edge
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
  - list:
      elements:
      - district: north
      - district: south
      - district: harbor
  template:
    metadata:
      name: 'meridian-edge-{{district}}'
    spec:
      project: meridian-edge
      source:
        repoURL: http://gitea.gitea.svc.cluster.local:3000/platform/meridian-platform.git
        targetRevision: main
        path: edge
      destination:
        server: https://kubernetes.default.svc
        namespace: 'meridian-{{district}}'
      syncPolicy:
        automated: {}
        syncOptions:
        - CreateNamespace=true
