apiVersion: apps/v1
kind: Deployment
metadata:
  name: dock-notify
  labels: {app: dock-notify}
spec:
  replicas: 1
  selector:
    matchLabels: {app: dock-notify}
  template:
    metadata:
      labels: {app: dock-notify}
    spec:
      terminationGracePeriodSeconds: 2
      containers:
      - name: web
        image: hashicorp/http-echo:1.0
        imagePullPolicy: IfNotPresent
        args: ["-text=dock-notify v1", "-listen=:5678"]
        ports:
        - containerPort: 5678
        resources:
          requests: {cpu: 10m, memory: 16Mi}
