apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kiosk-menu
  namespace: argocd
spec:
  project: default
  source:
    repoURL: http://gitea.gitea.svc.cluster.local:3000/platform/kiosk-menu.git
    targetRevision: main
    path: k8s
  destination:
    name: in-cluster
    namespace: kiosk
  syncPolicy:
    automated: {}
