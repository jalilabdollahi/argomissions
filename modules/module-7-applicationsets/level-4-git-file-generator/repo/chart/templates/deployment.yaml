apiVersion: apps/v1
kind: Deployment
metadata:
  name: tenant-portal
  labels: {app: tenant-portal}
spec:
  replicas: 1
  selector:
    matchLabels: {app: tenant-portal}
  template:
    metadata:
      labels: {app: tenant-portal}
    spec:
      terminationGracePeriodSeconds: 2
      containers:
      - name: web
        image: hashicorp/http-echo:1.0
        imagePullPolicy: IfNotPresent
        args: ["-text={{ .Values.message }}", "-listen=:5678"]
        ports:
        - containerPort: 5678
        resources:
          requests: {cpu: 10m, memory: 16Mi}
