apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: billing-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: http://gitea.gitea.svc.cluster.local:3000/platform/billing-gitops.git
    targetRevision: main
    path: apps
  destination:
    server: https://kubernetes.default.svc
    namespace: billing-system
  syncPolicy:
    automated: {}
    syncOptions:
    - CreateNamespace=true
