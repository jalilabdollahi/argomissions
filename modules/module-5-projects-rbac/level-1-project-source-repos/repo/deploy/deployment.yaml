apiVersion: apps/v1
kind: Deployment
metadata:
  name: claims-intake
  labels: {app: claims-intake}
spec:
  replicas: 1
  selector:
    matchLabels: {app: claims-intake}
  template:
    metadata:
      labels: {app: claims-intake}
    spec:
      terminationGracePeriodSeconds: 2
      containers:
      - name: web
        image: hashicorp/http-echo:1.0
        imagePullPolicy: IfNotPresent
        args: ["-text=claims-intake v2.3", "-listen=:5678"]
        ports:
        - containerPort: 5678
        resources:
          requests: {cpu: 10m, memory: 16Mi}
