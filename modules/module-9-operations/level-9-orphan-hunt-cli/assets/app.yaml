apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rates-service
  namespace: argocd
spec:
  project: default
  source:
    repoURL: http://gitea.gitea.svc.cluster.local:3000/platform/rates-service.git
    targetRevision: main
    path: deploy
  destination:
    server: https://kubernetes.default.svc
    namespace: fx-rates
  syncPolicy:
    automated: {}
    syncOptions:
      - CreateNamespace=true
