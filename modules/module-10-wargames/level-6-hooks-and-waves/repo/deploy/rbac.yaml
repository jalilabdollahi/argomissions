apiVersion: v1
kind: ServiceAccount
metadata:
  name: rota-migrator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rota-migrator
rules:
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rota-migrator
subjects:
- kind: ServiceAccount
  name: rota-migrator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: rota-migrator
