apiVersion: apps/v1
kind: Deployment
metadata:
  name: tracker-api
  labels:
    app.kubernetes.io/name: tracker-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tracker-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tracker-api
    spec:
      terminationGracePeriodSeconds: 2
      containers:
      - name: api
        image: hashicorp/http-echo:1.0
        imagePullPolicy: IfNotPresent
        args: ["-text=tracker-api v2 (plain manifests)", "-listen=:5678"]
        ports:
        - containerPort: 5678
        resources:
          requests: {cpu: 10m, memory: 16Mi}
