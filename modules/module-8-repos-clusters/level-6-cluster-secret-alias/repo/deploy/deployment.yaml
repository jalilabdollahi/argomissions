apiVersion: apps/v1
kind: Deployment
metadata:
  name: boarding-pass
  labels: {app: boarding-pass}
spec:
  replicas: 2
  selector:
    matchLabels: {app: boarding-pass}
  template:
    metadata:
      labels: {app: boarding-pass}
    spec:
      terminationGracePeriodSeconds: 2
      containers:
      - name: web
        image: hashicorp/http-echo:1.0
        imagePullPolicy: IfNotPresent
        args: ["-text=boarding-pass v3.1", "-listen=:5678"]
        ports:
        - containerPort: 5678
        resources:
          requests: {cpu: 10m, memory: 16Mi}
