apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tariff-legacy
  namespace: argocd
spec:
  project: default
  source:
    repoURL: http://gitea.gitea.svc.cluster.local:3000/platform/tariff-gitops.git
    targetRevision: main
    path: workloads/legacy
  destination:
    server: https://kubernetes.default.svc
    namespace: tariff-old
  syncPolicy:
    automated: {}
    syncOptions:
    - CreateNamespace=true
