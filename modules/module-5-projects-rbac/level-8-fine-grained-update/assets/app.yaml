apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rewards-engine
  namespace: argocd
spec:
  project: loyalty
  source:
    repoURL: http://gitea.gitea.svc.cluster.local:3000/platform/rewards-engine.git
    targetRevision: main
    path: deploy
  destination:
    server: https://kubernetes.default.svc
    namespace: rewards
  syncPolicy:
    automated: {}
