apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      terminationGracePeriodSeconds: 2
      containers:
      - name: suggest
        image: hashicorp/http-echo:1.0
        imagePullPolicy: IfNotPresent
        args: ["-text={{ .Values.banner }}", "-listen=:5678"]
        ports:
        - containerPort: 5678
        resources:
          requests: {cpu: 10m, memory: 16Mi}
