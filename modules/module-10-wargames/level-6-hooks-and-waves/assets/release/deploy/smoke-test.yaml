apiVersion: batch/v1
kind: Job
metadata:
  name: shiftboard-smoke
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 2
      containers:
      - name: smoke
        image: curlimages/curl:8.10.1
        imagePullPolicy: IfNotPresent
        command: ["sh", "-c", "ok=0; for i in 1 2 3 4 5; do curl -fsS --max-time 5 http://shiftboard-api/ | grep -q 'shiftboard v7' && ok=1 && break; sleep 3; done; [ $ok = 1 ]"]
        resources:
          requests: {cpu: 10m, memory: 16Mi}
