apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: stockroom-db-v2
  namespace: argocd
spec:
  project: default
  source:
    repoURL: http://gitea.gitea.svc.cluster.local:3000/platform/stockroom-db.git
    targetRevision: main
    path: manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: stockroom
  syncPolicy:
    automated:
      prune: true
    syncOptions:
    - CreateNamespace=true
