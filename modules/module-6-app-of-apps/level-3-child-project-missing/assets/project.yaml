apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: tracing-team
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  description: Tracing team services
  sourceRepos:
  - http://gitea.gitea.svc.cluster.local:3000/platform/tracing-gitops.git
  destinations:
  - server: https://kubernetes.default.svc
    namespace: tracing-collector
  - server: https://kubernetes.default.svc
    namespace: tracing-query
  clusterResourceWhitelist:
  - group: ""
    kind: Namespace
