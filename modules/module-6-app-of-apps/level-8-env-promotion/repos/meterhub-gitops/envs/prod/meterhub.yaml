apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: meterhub-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: http://gitea.gitea.svc.cluster.local:3000/platform/meterhub-service.git
    targetRevision: main
    path: deploy
  destination:
    server: https://kubernetes.default.svc
    namespace: meterhub-prod
  syncPolicy:
    automated:
      prune: true
    syncOptions:
    - CreateNamespace=true
