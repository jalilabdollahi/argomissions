apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dunning-worker
spec:
  project: default
  source:
    repoURL: http://gitea.gitea.svc.cluster.local:3000/platform/billing-gitops.git
    targetRevision: main
    path: workloads/dunning
  destination:
    server: https://kubernetes.default.svc
    namespace: billing-dunning
  syncPolicy:
    automated: {}
    syncOptions:
    - CreateNamespace=true
