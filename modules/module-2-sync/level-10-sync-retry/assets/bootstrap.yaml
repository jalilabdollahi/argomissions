# The platform bootstrap: a job that installs the SensorProfile CRD about 100 seconds after the cluster is built.
apiVersion: v1
kind: Namespace
metadata:
  name: iot-bootstrap
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: crd-installer
  namespace: iot-bootstrap
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: argomissions-sensor-crd-installer
  labels: {argomissions.io/cleanup: "true"}
rules:
- apiGroups: ["apiextensions.k8s.io"]
  resources: ["customresourcedefinitions"]
  verbs: ["create", "get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: argomissions-sensor-crd-installer
  labels: {argomissions.io/cleanup: "true"}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: argomissions-sensor-crd-installer}
subjects:
- {kind: ServiceAccount, name: crd-installer, namespace: iot-bootstrap}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sensor-crd
  namespace: iot-bootstrap
data:
  crd.json: |
    {"apiVersion":"apiextensions.k8s.io/v1","kind":"CustomResourceDefinition",
     "metadata":{"name":"sensorprofiles.runtime.argomissions.io","labels":{"argomissions.io/cleanup":"true"}},
     "spec":{"group":"runtime.argomissions.io","scope":"Namespaced",
       "names":{"kind":"SensorProfile","plural":"sensorprofiles","singular":"sensorprofile"},
       "versions":[{"name":"v1","served":true,"storage":true,
         "schema":{"openAPIV3Schema":{"type":"object","x-kubernetes-preserve-unknown-fields":true}}}]}}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: install-sensor-crd
  namespace: iot-bootstrap
spec:
  backoffLimit: 4
  template:
    spec:
      serviceAccountName: crd-installer
      restartPolicy: OnFailure
      terminationGracePeriodSeconds: 2
      containers:
      - name: installer
        image: curlimages/curl:8.10.1
        imagePullPolicy: IfNotPresent
        command: ["sh", "-c"]
        args:
        - |
          sleep 100
          sa=/var/run/secrets/kubernetes.io/serviceaccount
          curl -fsS --cacert $sa/ca.crt -H "Authorization: Bearer $(cat $sa/token)" \
            -H 'Content-Type: application/json' -X POST -d @/crd/crd.json \
            https://kubernetes.default.svc/apis/apiextensions.k8s.io/v1/customresourcedefinitions
        resources:
          requests: {cpu: 10m, memory: 16Mi}
        volumeMounts:
        - {name: crd, mountPath: /crd}
      volumes:
      - name: crd
        configMap: {name: sensor-crd}
