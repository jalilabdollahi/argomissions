apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels: {app: {{ .Release.Name }}}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: {{ .Release.Name }}}
  template:
    metadata:
      labels: {app: {{ .Release.Name }}}
    spec:
      terminationGracePeriodSeconds: 2
      containers:
      - name: db
        image: busybox:1.36
        imagePullPolicy: IfNotPresent
        command: ["sh", "-c", 'mkdir -p /www; echo "$MESSAGE" > /www/index.html; [ -f /data/seq ] || echo "seq=0 fresh-volume" > /data/seq; ln -sf /data/seq /www/seq; exec httpd -f -p 8080 -h /www']
        env:
        - {name: MESSAGE, value: {{ .Values.message | quote }}}
        ports:
        - containerPort: 8080
        volumeMounts:
        - {name: data, mountPath: /data}
        resources:
          requests: {cpu: 10m, memory: 16Mi}
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: {{ include "stockroom.claim" . }}
