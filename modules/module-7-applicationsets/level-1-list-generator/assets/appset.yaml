apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: geo-edge
  namespace: argocd
spec:
  generators:
  - list:
      elements:
      - region: us-east
      - region: ap-south
  template:
    metadata:
      name: 'geo-edge-{{region}}'
    spec:
      project: default
      source:
        repoURL: http://gitea.gitea.svc.cluster.local:3000/platform/geo-edge.git
        targetRevision: main
        path: chart
        helm:
          parameters:
          - name: region
            value: '{{region}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: 'geo-{{region}}'
      syncPolicy:
        automated: {}
        syncOptions:
        - CreateNamespace=true
