apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: statusboards.argomissions.io
  labels:
    argomissions.io/cleanup: "true"
spec:
  group: argomissions.io
  scope: Namespaced
  names:
    kind: StatusBoard
    listKind: StatusBoardList
    plural: statusboards
    singular: statusboard
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                title:
                  type: string
                panels:
                  type: array
                  items:
                    type: object
                    required: [name, query]
                    properties:
                      name:
                        type: string
                      query:
                        type: string
                      refresh:
                        type: string
                        default: 30s
