apiVersion: apps/v1
kind: Deployment
metadata:
  name: tallyline-gateway
  labels:
    app: tallyline-gateway
    complyd.argomissions.io/scan: pending
spec:
  replicas: 1
  selector:
    matchLabels: {app: tallyline-gateway}
  template:
    metadata:
      labels: {app: tallyline-gateway}
    spec:
      terminationGracePeriodSeconds: 2
      containers:
      - name: web
        image: hashicorp/http-echo:1.0
        imagePullPolicy: IfNotPresent
        args: ["-text=tallyline-gateway v4.2", "-listen=:5678"]
        ports:
        - containerPort: 5678
        resources:
          requests: {cpu: 10m, memory: 16Mi}
