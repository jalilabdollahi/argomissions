apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: mesh
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
  - matrix:
      generators:
      - git:
          repoURL: http://gitea.gitea.svc.cluster.local:3000/platform/mesh-services.git
          revision: main
          directories:
          - path: services/*
      - list:
          elements:
          - env: staging
          - env: prod
  template:
    metadata:
      name: '{{.path.basename}}'
    spec:
      project: default
      source:
        repoURL: http://gitea.gitea.svc.cluster.local:3000/platform/mesh-services.git
        targetRevision: main
        path: '{{.path.path}}'
        helm:
          parameters:
          - name: env
            value: '{{.env}}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{.path.basename}}-{{.env}}'
      syncPolicy:
        automated: {}
        syncOptions:
        - CreateNamespace=true
