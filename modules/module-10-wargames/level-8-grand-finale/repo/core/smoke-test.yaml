apiVersion: batch/v1
kind: Job
metadata:
  name: meridian-core-smoke
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 2
      containers:
      - name: smoke
        image: curlimages/curl:8.10.1
        imagePullPolicy: IfNotPresent
        command: ["sh", "-c", "curl -fsS --max-time 5 http://meridian-core:8080/ | grep -q 'meridian-core'"]
        resources:
          requests: {cpu: 10m, memory: 16Mi}
