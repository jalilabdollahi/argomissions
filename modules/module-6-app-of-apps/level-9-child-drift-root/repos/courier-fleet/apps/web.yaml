apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: courier-tracking
  namespace: argocd
spec:
  project: default
  source:
    repoURL: http://gitea.gitea.svc.cluster.local:3000/platform/courier-services.git
    targetRevision: main
    path: web
  destination:
    server: https://kubernetes.default.svc
    namespace: courier-tracking
  syncPolicy:
    automated:
      prune: true
    syncOptions:
    - CreateNamespace=true
