apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: custody-metrics-reader
rules:
- apiGroups: [""]
  resources: ["nodes", "pods"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: custody-metrics-reader
subjects:
- kind: ServiceAccount
  name: custody-api
  namespace: custody
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: custody-metrics-reader
