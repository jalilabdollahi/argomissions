apiVersion: apps/v1
kind: Deployment
metadata:
  name: host-registry
  labels: {app: host-registry}
spec:
  replicas: 1
  selector:
    matchLabels: {app: host-registry}
  template:
    metadata:
      labels: {app: host-registry}
    spec:
      terminationGracePeriodSeconds: 2
      containers:
      - name: web
        image: hashicorp/http-echo:1.0
        imagePullPolicy: IfNotPresent
        args: ["-text=host-registry v1.0", "-listen=:5678"]
        ports:
        - containerPort: 5678
        resources:
          requests: {cpu: 10m, memory: 16Mi}
        volumeMounts:
        - {name: inventory, mountPath: /data, readOnly: true}
      volumes:
      - name: inventory
        configMap:
          name: host-inventory
