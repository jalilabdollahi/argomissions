apiVersion: apps/v1
kind: Deployment
metadata:
  name: profile-svc
  labels:
    app: profile-svc
    cost-center: unassigned
spec:
  replicas: 1
  selector:
    matchLabels: {app: profile-svc}
  template:
    metadata:
      labels: {app: profile-svc}
    spec:
      terminationGracePeriodSeconds: 2
      containers:
      - name: svc
        image: hashicorp/http-echo:1.0
        imagePullPolicy: IfNotPresent
        args: ["-text=profile-svc v2.3", "-listen=:5678"]
        ports:
        - containerPort: 5678
        resources:
          requests: {cpu: 10m, memory: 16Mi}
