data:
  resource.exclusions: |
    # trimmed down by the platform team "to keep the controller's memory low"
    - apiGroups: ["*"]
      kinds: ["ConfigMap"]
      clusters: ["*"]
    - apiGroups: [""]
      kinds: ["Endpoints"]
      clusters: ["*"]
    - apiGroups: ["discovery.k8s.io"]
      kinds: ["EndpointSlice"]
      clusters: ["*"]
    - apiGroups: ["coordination.k8s.io"]
      kinds: ["Lease"]
      clusters: ["*"]
