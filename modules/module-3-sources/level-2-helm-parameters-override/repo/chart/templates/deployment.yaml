apiVersion: apps/v1
kind: Deployment
metadata:
  name: media-gateway
  labels:
    app: media-gateway
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: media-gateway
  template:
    metadata:
      labels:
        app: media-gateway
    spec:
      terminationGracePeriodSeconds: 2
      containers:
      - name: gateway
        image: hashicorp/http-echo:1.0
        imagePullPolicy: IfNotPresent
        args: ["-text=media-gateway {{ .Values.release.version }}", "-listen=:5678"]
        ports:
        - containerPort: 5678
        resources:
          requests: {cpu: 10m, memory: 16Mi}
