apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: mesh-fleet
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
  - scmProvider:
      requeueAfterSeconds: 30
      gitea:
        owner: platform
        api: http://gitea.gitea.svc.cluster.local:3000
        tokenRef:
          secretName: gitea-scm-token
          key: access-token
      filters:
      - repositoryMatch: '^mesh-'
  template:
    metadata:
      name: '{{.repository}}'
    spec:
      project: default
      source:
        repoURL: 'http://gitea.gitea.svc.cluster.local:3000/{{.organization}}/{{.repository}}.git'
        targetRevision: '{{.branch}}'
        path: deploy
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{.repository}}'
      syncPolicy:
        automated: {}
        syncOptions:
        - CreateNamespace=true
