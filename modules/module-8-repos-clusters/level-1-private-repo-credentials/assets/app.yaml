apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault-ui
  namespace: argocd
spec:
  project: default
  source:
    repoURL: http://gitea.gitea.svc.cluster.local:3000/platform/vault-ui.git
    targetRevision: main
    path: deploy
  destination:
    name: in-cluster
    namespace: vault-ui
  syncPolicy:
    automated: {}
