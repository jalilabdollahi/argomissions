apiVersion: apps/v1
kind: Deployment
metadata:
  name: ticket-desk
  labels: {app.kubernetes.io/name: ticket-desk}
spec:
  replicas: 2
  selector:
    matchLabels: {app.kubernetes.io/name: ticket-desk}
  template:
    metadata:
      labels: {app.kubernetes.io/name: ticket-desk}
    spec:
      terminationGracePeriodSeconds: 2
      containers:
      - name: web
        image: hashicorp/http-echo:1.0
        imagePullPolicy: IfNotPresent
        args: ["-text=ticket-desk v1.1", "-listen=:5678"]
        ports:
        - containerPort: 5678
        resources:
          requests: {cpu: 10m, memory: 16Mi}
