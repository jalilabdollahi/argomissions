apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trace-query
  namespace: argocd
spec:
  project: tracing-team
  source:
    repoURL: http://gitea.gitea.svc.cluster.local:3000/platform/tracing-gitops.git
    targetRevision: main
    path: workloads/tquery
  destination:
    server: https://kubernetes.default.svc
    namespace: tracing-query
  syncPolicy:
    automated: {}
    syncOptions:
    - CreateNamespace=true
