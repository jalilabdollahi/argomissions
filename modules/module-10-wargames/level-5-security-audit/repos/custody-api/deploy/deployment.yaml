apiVersion: apps/v1
kind: Deployment
metadata:
  name: custody-api
  labels: {app: custody-api}
spec:
  replicas: 1
  selector:
    matchLabels: {app: custody-api}
  template:
    metadata:
      labels: {app: custody-api}
    spec:
      serviceAccountName: custody-api
      terminationGracePeriodSeconds: 2
      containers:
      - name: web
        image: hashicorp/http-echo:1.0
        imagePullPolicy: IfNotPresent
        args: ["-text=custody-api v3.1", "-listen=:5678"]
        ports:
        - containerPort: 5678
        env:
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef: {name: custody-db, key: password}
        resources:
          requests: {cpu: 10m, memory: 16Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: custody-api
spec:
  selector: {app: custody-api}
  ports:
  - port: 80
    targetPort: 5678
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: custody-api
