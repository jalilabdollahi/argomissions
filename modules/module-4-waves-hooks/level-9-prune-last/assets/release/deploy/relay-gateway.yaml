# Release v2.0 renames relay -> relay-gateway (Deployment and Service).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: relay-gateway
  labels: {app: relay-gateway}
spec:
  replicas: 1
  selector:
    matchLabels: {app: relay-gateway}
  template:
    metadata:
      labels: {app: relay-gateway}
    spec:
      terminationGracePeriodSeconds: 2
      containers:
      - name: relay
        image: hashicorp/http-echo:1.0
        imagePullPolicy: IfNotPresent
        args: ["-text=chat-relay v2.0", "-listen=:5678"]
        ports:
        - containerPort: 5678
        readinessProbe:
          httpGet:
            path: /
            port: 5678
          initialDelaySeconds: 8
          periodSeconds: 2
        resources:
          requests: {cpu: 10m, memory: 16Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: relay-gateway
spec:
  selector: {app: relay-gateway}
  ports:
  - port: 80
    targetPort: 5678
