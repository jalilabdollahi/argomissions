apiVersion: apps/v1
kind: Deployment
metadata:
  name: kiosk-menu
  labels: {app: kiosk-menu}
spec:
  replicas: 1
  selector:
    matchLabels: {app: kiosk-menu}
  template:
    metadata:
      labels: {app: kiosk-menu}
    spec:
      terminationGracePeriodSeconds: 2
      containers:
      - name: web
        image: hashicorp/http-echo:1.0
        imagePullPolicy: IfNotPresent
        args: ["-text=kiosk-menu v1.1", "-listen=:5678"]
        ports:
        - containerPort: 5678
        resources:
          requests: {cpu: 10m, memory: 16Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: kiosk-menu
spec:
  selector: {app: kiosk-menu}
  ports:
  - port: 80
    targetPort: 5678
