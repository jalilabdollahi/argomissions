apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: region-configs
  namespace: argocd
spec:
  project: default
  source:
    repoURL: http://gitea.gitea.svc.cluster.local:3000/platform/region-configs.git
    targetRevision: main
    path: deploy
  destination:
    name: in-cluster
    namespace: regions
  ignoreDifferences:
  - kind: ConfigMap
    name: visit-counter
    jsonPointers:
    - /data/count
