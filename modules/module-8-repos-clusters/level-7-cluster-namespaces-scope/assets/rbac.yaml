# Deployer ServiceAccount: full rights, but only inside the two parcel namespaces.
apiVersion: v1
kind: ServiceAccount
metadata: {name: argocd-regional, namespace: parcel-eu}
---
apiVersion: v1
kind: Secret
metadata:
  name: argocd-regional-token
  namespace: parcel-eu
  annotations: {kubernetes.io/service-account.name: argocd-regional}
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: argocd-regional, namespace: parcel-eu}
rules: [{apiGroups: ["*"], resources: ["*"], verbs: ["*"]}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: argocd-regional, namespace: parcel-eu}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: argocd-regional}
subjects: [{kind: ServiceAccount, name: argocd-regional, namespace: parcel-eu}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: argocd-regional, namespace: parcel-us}
rules: [{apiGroups: ["*"], resources: ["*"], verbs: ["*"]}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: argocd-regional, namespace: parcel-us}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: argocd-regional}
subjects: [{kind: ServiceAccount, name: argocd-regional, namespace: parcel-eu}]
