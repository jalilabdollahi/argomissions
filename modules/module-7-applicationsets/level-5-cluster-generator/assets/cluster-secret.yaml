apiVersion: v1
kind: Secret
metadata:
  name: cluster-staging
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: cluster
    team: platform
type: Opaque
stringData:
  name: staging
  server: https://kubernetes.default.svc.cluster.local
  config: |
    {"bearerToken": "__TOKEN__", "tlsClientConfig": {"insecure": true}}
