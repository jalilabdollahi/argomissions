apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: telemetry
  namespace: argocd
spec:
  project: default
  source:
    repoURL: http://gitea.gitea.svc.cluster.local:3000/platform/telemetry.git
    targetRevision: main
    path: deploy
  destination:
    server: https://kubernetes.default.svc.cluster.local
    namespace: telemetry
