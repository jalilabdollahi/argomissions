apiVersion: apps/v1
kind: Deployment
metadata:
  name: docs-portal
  labels: {app: docs-portal}
spec:
  replicas: 2
  selector:
    matchLabels: {app: docs-portal}
  template:
    metadata:
      labels: {app: docs-portal}
    spec:
      terminationGracePeriodSeconds: 2
      containers:
      - name: web
        image: hashicorp/http-echo:1.0
        imagePullPolicy: IfNotPresent
        args: ["-text=docs-portal v1.8", "-listen=:5678"]
        ports:
        - containerPort: 5678
        resources:
          requests: {cpu: 10m, memory: 16Mi}
