apiVersion: apps/v1
kind: Deployment
metadata:
  name: tariff-legacy
  labels: {app: tariff-legacy}
spec:
  replicas: 1
  selector:
    matchLabels: {app: tariff-legacy}
  template:
    metadata:
      labels: {app: tariff-legacy}
    spec:
      terminationGracePeriodSeconds: 2
      containers:
      - name: web
        image: hashicorp/http-echo:1.0
        imagePullPolicy: IfNotPresent
        args: ["-text=tariff-legacy v1.9", "-listen=:5678"]
        ports:
        - containerPort: 5678
        resources:
          requests: {cpu: 10m, memory: 16Mi}
