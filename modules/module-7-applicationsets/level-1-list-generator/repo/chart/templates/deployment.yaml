apiVersion: apps/v1
kind: Deployment
metadata:
  name: geo-edge
  labels: {app: geo-edge}
spec:
  replicas: 1
  selector:
    matchLabels: {app: geo-edge}
  template:
    metadata:
      labels: {app: geo-edge}
    spec:
      terminationGracePeriodSeconds: 2
      containers:
      - name: web
        image: hashicorp/http-echo:1.0
        imagePullPolicy: IfNotPresent
        args: ["-text=geo-edge {{ .Values.region }}", "-listen=:5678"]
        ports:
        - containerPort: 5678
        resources:
          requests: {cpu: 10m, memory: 16Mi}
