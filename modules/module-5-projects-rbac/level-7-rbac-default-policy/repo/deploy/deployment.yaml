apiVersion: apps/v1
kind: Deployment
metadata:
  name: claims-portal
  labels: {app: claims-portal}
spec:
  replicas: 1
  selector:
    matchLabels: {app: claims-portal}
  template:
    metadata:
      labels: {app: claims-portal}
    spec:
      terminationGracePeriodSeconds: 2
      containers:
      - name: api
        image: hashicorp/http-echo:1.0
        imagePullPolicy: IfNotPresent
        args: ["-text=claims-portal v1", "-listen=:5678"]
        ports:
        - containerPort: 5678
        resources:
          requests: {cpu: 10m, memory: 16Mi}
