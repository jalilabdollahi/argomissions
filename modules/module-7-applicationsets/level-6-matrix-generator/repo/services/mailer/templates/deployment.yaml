apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailer
  labels: {app: mailer}
spec:
  replicas: 1
  selector:
    matchLabels: {app: mailer}
  template:
    metadata:
      labels: {app: mailer}
    spec:
      terminationGracePeriodSeconds: 2
      containers:
      - name: web
        image: hashicorp/http-echo:1.0
        imagePullPolicy: IfNotPresent
        args: ["-text=mailer {{ .Values.env }}", "-listen=:5678"]
        ports:
        - containerPort: 5678
        resources:
          requests: {cpu: 10m, memory: 16Mi}
