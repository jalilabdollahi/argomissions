apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pricing-api
  namespace: argocd
spec:
  project: default
  source:
    repoURL: http://gitea.gitea.svc.cluster.local:3000/platform/pricing-api.git
    targetRevision: main
    path: deploy
  destination:
    server: https://kubernetes.default.svc
    namespace: pricing
  syncPolicy:
    automated: {}
