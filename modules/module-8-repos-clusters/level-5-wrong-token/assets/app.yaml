apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mailroom
  namespace: argocd
spec:
  project: default
  source:
    repoURL: http://gitea.gitea.svc.cluster.local:3000/platform/mailroom.git
    targetRevision: main
    path: app
  destination:
    name: in-cluster
    namespace: mailroom
  syncPolicy:
    automated: {}
