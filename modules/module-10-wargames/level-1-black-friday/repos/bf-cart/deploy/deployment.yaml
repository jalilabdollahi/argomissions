apiVersion: apps/v1
kind: Deployment
metadata:
  name: bf-cart
  labels: {app: bf-cart}
spec:
  replicas: 2
  selector:
    matchLabels: {app: bf-cart}
  template:
    metadata:
      labels: {app: bf-cart}
    spec:
      terminationGracePeriodSeconds: 2
      containers:
      - name: web
        image: hashicorp/http-echo:1.0
        imagePullPolicy: IfNotPresent
        args: ["-text=bf-cart v8.2", "-listen=:5678"]
        ports:
        - containerPort: 5678
        resources:
          requests: {cpu: 10m, memory: 16Mi}
