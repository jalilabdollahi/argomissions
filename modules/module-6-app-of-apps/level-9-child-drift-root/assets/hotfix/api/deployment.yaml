apiVersion: apps/v1
kind: Deployment
metadata:
  name: courier-routing
  labels: {app: courier-routing}
spec:
  replicas: 1
  selector:
    matchLabels: {app: courier-routing}
  template:
    metadata:
      labels: {app: courier-routing}
    spec:
      terminationGracePeriodSeconds: 2
      containers:
      - name: web
        image: hashicorp/http-echo:1.0
        imagePullPolicy: IfNotPresent
        args: ["-text=courier-routing v2.4.1", "-listen=:5678"]
        ports:
        - containerPort: 5678
        resources:
          requests: {cpu: 10m, memory: 16Mi}
