apiVersion: apps/v1
kind: Deployment
metadata:
  name: feedhub
  labels: {app: feedhub}
spec:
  replicas: 1
  selector:
    matchLabels: {app: feedhub}
  template:
    metadata:
      labels: {app: feedhub}
    spec:
      terminationGracePeriodSeconds: 2
      containers:
      - name: web
        image: hashicorp/http-echo:1.0
        imagePullPolicy: IfNotPresent
        args: ["-text=feedhub v1.8.1-hotfix", "-listen=:5678"]
        ports:
        - containerPort: 5678
        resources:
          requests: {cpu: 10m, memory: 16Mi}
