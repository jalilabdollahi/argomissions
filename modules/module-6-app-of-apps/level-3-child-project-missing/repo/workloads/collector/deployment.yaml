apiVersion: apps/v1
kind: Deployment
metadata:
  name: trace-collector
  labels: {app: trace-collector}
spec:
  replicas: 1
  selector:
    matchLabels: {app: trace-collector}
  template:
    metadata:
      labels: {app: trace-collector}
    spec:
      terminationGracePeriodSeconds: 2
      containers:
      - name: web
        image: hashicorp/http-echo:1.0
        imagePullPolicy: IfNotPresent
        args: ["-text=trace-collector v5.1", "-listen=:5678"]
        ports:
        - containerPort: 5678
        resources:
          requests: {cpu: 10m, memory: 16Mi}
