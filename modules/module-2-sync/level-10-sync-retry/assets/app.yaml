apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sensor-hub
  namespace: argocd
spec:
  project: default
  source:
    repoURL: http://gitea.gitea.svc.cluster.local:3000/platform/sensor-hub.git
    targetRevision: main
    path: deploy
  destination:
    name: in-cluster
    namespace: iot-edge
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 2
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 30s
