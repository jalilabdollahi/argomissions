apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: payout-worker
  namespace: argocd
spec:
  project: default
  source:
    repoURL: http://gitea.gitea.svc.cluster.local:3000/platform/payout-worker.git
    targetRevision: main
    path: deploy
  destination:
    server: https://kubernetes.default.svc
    namespace: payouts
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
