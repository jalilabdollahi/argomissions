apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: search-api
  namespace: argocd
spec:
  project: default
  source:
    repoURL: http://gitea.gitea.svc.cluster.local:3000/platform/search-api.git
    targetRevision: main
    path: deploy
  destination:
    server: https://kubernetes.default.svc
    namespace: search
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
