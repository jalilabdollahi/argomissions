apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gallery-web
  namespace: argocd
spec:
  project: default
  source:
    repoURL: http://gitea.gitea.svc.cluster.local:3000/platform/gallery-web.git
    targetRevision: main
    path: deploy
  destination:
    server: https://kubernetes.default.svc
    namespace: gallery
  syncPolicy:
    automated: {}
