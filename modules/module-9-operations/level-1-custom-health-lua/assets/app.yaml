apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vaultline
  namespace: argocd
spec:
  project: default
  source:
    repoURL: http://gitea.gitea.svc.cluster.local:3000/platform/vaultline-backups.git
    targetRevision: main
    path: backups
  destination:
    server: https://kubernetes.default.svc
    namespace: vaultline
  syncPolicy:
    automated: {}
