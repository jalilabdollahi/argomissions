apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shipping-ui
  namespace: argocd
spec:
  project: default
  source:
    repoURL: http://gitea.gitea.svc.cluster.local:3000/platform/shipping-ui.git
    targetRevision: main
    path: deploy
  destination:
    server: https://kubernetes.default.svc
    namespace: shipping
  syncPolicy:
    syncOptions:
    - CreateNamespace=true
