apiVersion: apps/v1
kind: Deployment
metadata:
  name: ticket-desk
  labels:
    app: ticket-desk
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ticket-desk
  template:
    metadata:
      labels:
        app: ticket-desk
    spec:
      terminationGracePeriodSeconds: 2
      containers:
      - name: web
        image: ticket-desk-web
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
        readinessProbe:
          httpGet: {path: /, port: 80}
          periodSeconds: 2
        resources:
          requests: {cpu: 10m, memory: 16Mi}
