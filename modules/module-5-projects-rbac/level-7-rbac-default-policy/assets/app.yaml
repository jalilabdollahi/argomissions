apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: claims-portal
  namespace: argocd
spec:
  project: default
  source:
    repoURL: http://gitea.gitea.svc.cluster.local:3000/platform/claims-portal.git
    targetRevision: main
    path: deploy
  destination:
    server: https://kubernetes.default.svc
    namespace: underwriting
  syncPolicy:
    automated: {}
