apiVersion: apps/v1
kind: Deployment
metadata:
  name: lumen-gateway
  labels: {app: lumen-gateway}
spec:
  replicas: 1
  selector:
    matchLabels: {app: lumen-gateway}
  template:
    metadata:
      labels: {app: lumen-gateway}
    spec:
      terminationGracePeriodSeconds: 2
      containers:
      - name: gateway
        image: hashicorp/http-echo:1.0
        imagePullPolicy: IfNotPresent
        args: ["-text=lumen-gateway v1", "-listen=:5678"]
        ports:
        - containerPort: 5678
        resources:
          requests: {cpu: 10m, memory: 16Mi}
