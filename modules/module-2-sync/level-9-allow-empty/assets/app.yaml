apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nightly-etl
  namespace: argocd
spec:
  project: default
  source:
    repoURL: http://gitea.gitea.svc.cluster.local:3000/platform/nightly-etl.git
    targetRevision: main
    path: deploy
  destination:
    name: in-cluster
    namespace: etl
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
