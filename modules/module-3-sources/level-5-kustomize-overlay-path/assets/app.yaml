apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: inventory-sync
  namespace: argocd
spec:
  project: default
  source:
    repoURL: http://gitea.gitea.svc.cluster.local:3000/platform/inventory-sync.git
    targetRevision: main
    path: kustomize/base
  destination:
    server: https://kubernetes.default.svc
    namespace: inventory
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
