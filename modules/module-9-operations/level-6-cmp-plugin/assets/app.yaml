apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: label-printer
  namespace: argocd
spec:
  project: default
  source:
    repoURL: http://gitea.gitea.svc.cluster.local:3000/platform/label-printer.git
    targetRevision: main
    path: deploy
  destination:
    server: https://kubernetes.default.svc
    namespace: labels-print
  syncPolicy:
    automated: {}
    syncOptions:
      - CreateNamespace=true
