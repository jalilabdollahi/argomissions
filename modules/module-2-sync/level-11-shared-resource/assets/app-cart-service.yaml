apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cart-service
  namespace: argocd
spec:
  project: default
  source:
    repoURL: http://gitea.gitea.svc.cluster.local:3000/platform/storefront-apps.git
    targetRevision: main
    path: cart
  destination:
    name: in-cluster
    namespace: storefront
  syncPolicy:
    automated:
      selfHeal: true
