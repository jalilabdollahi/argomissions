apiVersion: apps/v1
kind: Deployment
metadata:
  name: metrics-gw
  labels: {app: metrics-gw}
spec:
  replicas: 1
  selector:
    matchLabels: {app: metrics-gw}
  template:
    metadata:
      labels: {app: metrics-gw}
    spec:
      terminationGracePeriodSeconds: 2
      containers:
      - name: gw
        image: hashicorp/http-echo:1.0
        imagePullPolicy: IfNotPresent
        args: ["-text=metrics-gw v1.0", "-listen=:5678"]
        ports:
        - containerPort: 5678
        resources:
          requests: {cpu: 10m, memory: 16Mi}
