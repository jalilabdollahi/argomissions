apiVersion: apps/v1
kind: Deployment
metadata:
  name: lobby-board
  labels:
    app: lobby-board
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lobby-board
  template:
    metadata:
      labels:
        app: lobby-board
    spec:
      terminationGracePeriodSeconds: 2
      containers:
        - name: app
          image: hashicorp/http-echo:1.0
          imagePullPolicy: IfNotPresent
          args: ["-text=lobby-board v1.0", "-listen=:5678"]
          ports:
            - containerPort: 5678
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
