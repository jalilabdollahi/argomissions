apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ticket-desk
  namespace: argocd
spec:
  project: default
  source:
    repoURL: http://gitea.gitea.svc.cluster.local:3000/platform/ticket-desk.git
    targetRevision: main
    path: kustomize/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: desk
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
