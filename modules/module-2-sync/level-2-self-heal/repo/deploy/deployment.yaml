apiVersion: apps/v1
kind: Deployment
metadata:
  name: pricing-api
  labels: {app: pricing-api}
spec:
  replicas: 2
  selector:
    matchLabels: {app: pricing-api}
  template:
    metadata:
      labels: {app: pricing-api}
    spec:
      terminationGracePeriodSeconds: 2
      containers:
      - name: api
        image: hashicorp/http-echo:1.0
        imagePullPolicy: IfNotPresent
        args: ["-text=pricing-api v2.0", "-listen=:5678"]
        ports:
        - containerPort: 5678
        resources:
          requests: {cpu: 10m, memory: 16Mi}
