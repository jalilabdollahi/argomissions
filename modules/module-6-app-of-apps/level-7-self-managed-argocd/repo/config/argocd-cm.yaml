apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-cm
    app.kubernetes.io/part-of: argocd
data:
  url: http://localhost:__ARGOCD_PORT__
  admin.enabled: "true"
  timeout.reconciliation: 60s
  timeout.reconciliation.jitter: 0s
