# Lowers the banner again: deletes the maintenance-flag ConfigMap through the Kubernetes API.
apiVersion: batch/v1
kind: Job
metadata:
  name: exit-maintenance
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 0
  template:
    spec:
      serviceAccountName: maintenance-janitor
      restartPolicy: Never
      terminationGracePeriodSeconds: 2
      containers:
      - name: janitor
        image: curlimages/curl:8.10.1
        imagePullPolicy: IfNotPresent
        command:
        - sh
        - -c
        - |
          SA=/var/run/secrets/kubernetes.io/serviceaccount
          code=$(curl -s -o /tmp/out -w '%{http_code}' --cacert $SA/ca.crt \
            -H "Authorization: Bearer $(cat $SA/token)" -X DELETE \
            https://kubernetes.default.svc/api/v1/namespaces/bookings/configmaps/maintenance-flag)
          echo "DELETE maintenance-flag -> HTTP $code"
          [ "$code" = 200 ] || [ "$code" = 404 ]
        resources:
          requests: {cpu: 10m, memory: 16Mi}
