apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault-ui
  labels: {app: vault-ui}
spec:
  replicas: 1
  selector:
    matchLabels: {app: vault-ui}
  template:
    metadata:
      labels: {app: vault-ui}
    spec:
      terminationGracePeriodSeconds: 2
      containers:
      - name: web
        image: hashicorp/http-echo:1.0
        imagePullPolicy: IfNotPresent
        args: ["-text=vault-ui v2.4", "-listen=:5678"]
        ports:
        - containerPort: 5678
        resources:
          requests: {cpu: 10m, memory: 16Mi}
