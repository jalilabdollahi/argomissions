apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: catalog-svc
  namespace: argocd
spec:
  project: default
  source:
    repoURL: http://gitea.gitea.svc.cluster.local:3000/platform/shopfront-fleet.git
    targetRevision: main
    path: workloads/catalog
  destination:
    server: https://kubernetes.default.svc
    namespace: shop-catalog
  syncPolicy:
    automated: {}
    syncOptions:
    - CreateNamespace=true
