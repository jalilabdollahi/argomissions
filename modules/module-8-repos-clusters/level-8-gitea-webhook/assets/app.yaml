apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: catalog-api
  namespace: argocd
spec:
  project: default
  source:
    repoURL: http://gitea.gitea.svc.cluster.local:3000/platform/catalog-api.git
    targetRevision: main
    path: deploy
  destination:
    name: in-cluster
    namespace: catalog
  syncPolicy:
    automated: {}
