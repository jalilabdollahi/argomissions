apiVersion: apps/v1
kind: Deployment
metadata:
  name: tidewater-ledger
  labels: {app: tidewater-ledger}
spec:
  replicas: 2
  selector:
    matchLabels: {app: tidewater-ledger}
  template:
    metadata:
      labels: {app: tidewater-ledger}
    spec:
      terminationGracePeriodSeconds: 2
      containers:
      - name: web
        image: hashicorp/http-echo:1.0
        imagePullPolicy: IfNotPresent
        args: ["-text=tidewater-ledger v3.1", "-listen=:5678"]
        ports:
        - containerPort: 5678
        resources:
          requests: {cpu: 10m, memory: 16Mi}
