apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: host-registry
  namespace: argocd
spec:
  project: default
  source:
    repoURL: http://gitea.gitea.svc.cluster.local:3000/platform/host-registry.git
    targetRevision: main
    path: deploy
  destination:
    name: in-cluster
    namespace: netops
