apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: settle-api
  namespace: argocd
spec:
  project: settlements
  source:
    repoURL: http://gitea.gitea.svc.cluster.local:3000/platform/settle-api.git
    targetRevision: main
    path: deploy
  destination:
    server: https://kubernetes.default.svc
    namespace: settlements
  syncPolicy:
    automated: {}
